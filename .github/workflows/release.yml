name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version in module.json, without a leading v
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - name: Build release assets
        env:
          ELDORE_REPOSITORY: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export ELDORE_VERSION="${GITHUB_REF_NAME#v}"
          else
            export ELDORE_VERSION="$REQUESTED_VERSION"
          fi
          npm run build:release
      - name: Create GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          zip -qr npc-generator-dnd5e-eldore.zip npc-generator-dnd5e-eldore
          node ../tools/verify-release.mjs npc-generator-dnd5e-eldore.zip module.json
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest --generate-notes module.json npc-generator-dnd5e-eldore.zip
          else
            gh release create "v$REQUESTED_VERSION" --target "$GITHUB_SHA" --draft --generate-notes module.json npc-generator-dnd5e-eldore.zip
          fi
